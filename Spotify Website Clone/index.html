<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>
    <header class="nav bg-color flex items-center">
        <div class="left flex items-center">
            <img class="invert" src="images/logo.svg" alt="logo">
        </div>

        <div class="center flex items-center">
            <div class="home flex items-center">
                <a href="#"><img class="invert flex" src="images/home.svg" alt="home"></a>
            </div>

            <div class="search-bar flex justify-center items-center">
                <img src="images/search.svg" alt="search">
                <input type="text" placeholder="what do you want to play?">
                <div class="line"></div>
                <img src="images/browse.svg" alt="browse">
            </div>
        </div>

        <div class="right flex justify-center items-center">
            <button onclick="window.location.href='#';">Premium</button>
            <button onclick="window.location.href='#';">Support</button>
            <button onclick="window.location.href='#';">Download</button>
            <div class="line"></div>
            <div class="install flex justify-center items-center">
                <img src="images/install.svg" alt="install">
                <span>Install App</span>
            </div>
            <button>Sign up</button>
            <button>Log in</button>
        </div>
    </header>

    <main class="container flex">
        <aside class="side-bar bg-grey radius">
            <div class="sidebar-header flex items-center">
                <div class="library flex items-center">
                    <img class="invert flex" src="images/playlist.svg" alt="playlist">
                    <h4>Playlist Library</h4>
                </div>
                <div class="close"><img class="flex invert" src="images/close.svg" alt="add"></div>
            </div>

            <div class="songsList">
                <ul></ul>
            </div>

            <div class="sidebar-footer">
                <div class="footer-links">
                    <a href="#">Legal</a>
                    <a href="#">Safety & Privacy Center</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Cookies</a>
                    <a href="#">About Ads</a>
                    <a href="#">Accessibility</a>
                </div>
                <button class="lang-btn">🌐 English</button>
            </div>
        </aside>

        <div class="main-content bg-grey radius">
            <div class="playlist-header items-center">
                <div class="hamburger">
                    <img width="30px" class="invert" src="images/hamburger.svg" alt="hamburger">
                </div>
                <h1>All Playlists</h1>
            </div>

            <div class="playlist flex items-center"></div>

            <div class="playbar">
                <div class="seekBar">
                    <div class="circle"></div>
                </div>

                <div class="songData flex items-center">
                    <span class="songInfo flex items-center"></span>

                    <div class="songbutton flex justify-center items-center">
                        <img width="30" id="previousSong" src="images/prevsong.svg" alt="previous song">
                        <img width="30" id="playSong" src="images/play.svg" alt="play song">
                        <img width="30" id="nextSong" src="images/nextsong.svg" alt="next song">
                    </div>

                    <div class="timeVol flex">
                        <span class="songTime flex items-center"></span>

                        <div class="volume flex justify-center items-center">
                            <img class="flex" width="20" src="images/volume.svg" alt="volume">
                            <input type="range" name="volume" id="range">
                        </div>
                    </div>
                </div>
            </div>

            <div class="main-footer flex justify-center items-center">
                <p>Made with <span style="color: red;">❤</span> by Shahzaib Afzal</p>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
