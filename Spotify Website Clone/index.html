<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
</head>

<body>
    <header class="nav bg-color flex items-center">
        <div class="left flex items-center">
            <img class="invert" src="images/logo.svg" alt="logo">
        </div>

        <div class="center flex items-center">
            <div class="home flex items-center">
                <img class="invert" src="images/home.svg" alt="home">
            </div>

            <div class="search-bar flex justify-center items-center">
                <img src="images/search.svg" alt="search">
                <input type="text" placeholder="what do you want to play?">
                <div class="line"></div>
                <img src="images/browse.svg" alt="browse">
            </div>
        </div>

        <div class="right flex justify-center items-center">
            <button>Premium</button>
            <button>Support</button>
            <button>Download</button>
            <div class="line"></div>
            <div class="install flex justify-center items-center">
                <img src="images/install.svg" alt="install">
                <span>Install App</span>
            </div>
            <button>Sign up</button>
            <button>Log in</button>
        </div>
    </header>

    <main class="container flex">
        <aside class="side-bar bg-grey radius">
            <div class="sidebar-header flex items-center">
                <div class="library flex items-center">
                    <img class="invert flex" src="images/playlist.svg" alt="playlist">
                    <h4>Your Library</h4>
                </div>
                <div class="add"><img class="flex" src="images/plus.svg" alt="add"></div>
            </div>

            <div class="songsList">
                <ul></ul>
            </div>

            <div class="sidebar-footer">
                <div class="footer-links">
                    <a href="#">Legal</a>
                    <a href="#">Safety & Privacy Center</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Cookies</a>
                    <a href="#">About Ads</a>
                    <a href="#">Accessibility</a>
                </div>
                <button class="lang-btn">🌐 English</button>
            </div>
        </aside>

        <div class="main-content bg-grey radius">
            <div class="playlist">
                <div class="playlist-header items-center">
                    <h1>Trending Songs</h1>
                </div>

                <div class="cardContainer flex items-center">
                    <div class="card flex">
                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35">
                                <circle cx="12" cy="12" r="12" fill="#1ed760" />
                                <path
                                    d="M9.5 8.75C9.5 8.29 10.02 8.01 10.42 8.26L15.35 11.51C15.72 11.75 15.72 12.25 15.35 12.49L10.42 15.74C10.02 15.99 9.5 15.71 9.5 15.25V8.75Z"
                                    fill="#000000" />
                            </svg>
                        </div>
                        <img src="images/cardImage.jfif" alt="card Image">
                        <h2>Barsaat</h2>
                        <p>Banjaare, Roni</p>
                    </div>

                    <div class="card flex">
                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35">
                                <circle cx="12" cy="12" r="12" fill="#1ed760" />
                                <path
                                    d="M9.5 8.75C9.5 8.29 10.02 8.01 10.42 8.26L15.35 11.51C15.72 11.75 15.72 12.25 15.35 12.49L10.42 15.74C10.02 15.99 9.5 15.71 9.5 15.25V8.75Z"
                                    fill="#000000" />
                            </svg>
                        </div>
                        <img src="images/cardImage.jfif" alt="card Image">
                        <h2>Barsaat</h2>
                        <p>Banjaare, Roni</p>
                    </div>
                </div>

                <div class="playbar">
                    <div class="seekBar">
                        <div class="circle"></div>
                    </div>

                    <div class="songData flex items-center">
                        <span class="songInfo"></span>

                        <div class="songbutton flex justify-center items-center">
                            <img id="previousSong" src="images/prevsong.svg" alt="previous song">
                            <img id="playSong" src="images/play.svg" alt="play song">
                            <img id="nextSong" src="images/nextsong.svg" alt="next song">
                        </div>

                        <span class="songTime"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
</body>

</html>
