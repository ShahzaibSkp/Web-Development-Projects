<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validator</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #e9f0ff);
            color: #23395d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(35, 57, 93, 0.15);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #4a6cf7;
        }

        .instructions {
            background: #f8faff;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            line-height: 1.6;
            color: #50607a;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
        }

        input {
            padding: 12px 14px;
            border: 1px solid #d3dcf2;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4a6cf7, #6b8cff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 108, 247, 0.2);
        }

        .outputResult {
            margin-top: 16px;
            font-weight: 600;
            min-height: 24px;
            color: #23395d;
        }
    </style>
</head>

<body>
    <!-- The Password Validator: You are building a password validation feature. Create a function that checks if a given password meets the following criteria: at least 8 characters long, contains both uppercase and lowercase letters, and includes at least one digit. -->

    <div class="card">
        <h1>Password Validator</h1>
        <p class="instructions">Password must meet following criteria: <br>At least 8 characters long <br>Contains both uppercase and lowercase letters <br>Includes at least one digit</p>

        <div class="form-group">
            <label for="password">Please enter password here:</label>
            <input type="password" name="password" id="password">
            <button class="btn" onclick="passwordValidator()">Submit</button>
        </div>

        <p class="outputResult"></p>
    </div>

    <script>
        function passwordValidator() {
            const password = document.querySelector("#password").value;
            const hasMinLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasDigit = /\d/.test(password);

            if (hasMinLength && hasUppercase && hasLowercase && hasDigit) {
                document.querySelector(".outputResult").textContent = "You enter a valid password.";
            }

            else {
                document.querySelector(".outputResult").textContent = "You enter an invalid password. It must be at least 8 characters, include uppercase and lowercase letters, and at least one digit.";
            }
        }
    </script>
</body>

</html>
