<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather app</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="input-box">
            <input type="text" id="search" placeholder="Search for cities">
            <button class="search" type="button" aria-label="Search weather">
                <svg width="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M10.533 1.27893C5.35215 1.27893 1.12598 5.41887 1.12598 10.5579C1.12598 15.697 5.35215 19.8369 10.533 19.8369C12.767 19.8369 14.8235 19.0671 16.4402 17.7794L20.7929 22.132C21.1834 22.5226 21.8166 22.5226 22.2071 22.132C22.5976 21.7415 22.5976 21.1083 22.2071 20.7178L17.8634 16.3741C19.1616 14.7849 19.94 12.7634 19.94 10.5579C19.94 5.41887 15.7138 1.27893 10.533 1.27893ZM3.12598 10.5579C3.12598 6.55226 6.42768 3.27893 10.533 3.27893C14.6383 3.27893 17.94 6.55226 17.94 10.5579C17.94 14.5636 14.6383 17.8369 10.533 17.8369C6.42768 17.8369 3.12598 14.5636 3.12598 10.5579Z">
                    </path>
                </svg>
            </button>
        </div>

        <div class="theme-btn-wrapper">
            <button class="themeBtn" type="button" aria-label="Toggle theme">
                <svg class="dark" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7.8 7.8 0 0 0 18.5 13.5 7.8 7.8 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="light" fill="currentColor" stroke="currentColor" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">
                    <path
                        d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.64 5.64 4.22 4.22m15.56 15.56-1.42-1.42M18.36 5.64l1.42-1.42M4.22 19.78l1.42-1.42">
                    </path>
                    <circle cx="12" cy="12" r="4"></circle>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="temp-data">
                <div class="city">
                    <h1></h1>
                    <p>Country: </p>
                </div>
                <div class="temp-description">
                    <h1 class="temp"></h1>
                    <p class="weather-description"></p>
                </div>
            </div>

            <div class="temp-pic">
                <img src="images/clear.png" alt="Weather Picture">
            </div>
        </div>

        <div class="other-data">
            <div class="data-heading">
                <p>AIR CONDITIONS</p>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">
                    <div class="metric-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor"
                            class="feelsLike-svg" viewBox="0 0 16 16">
                            <path
                                d="M8 1.5A2.5 2.5 0 0 0 5.5 4v5.1a3.5 3.5 0 1 0 5 0V4A2.5 2.5 0 0 0 8 1.5m0 1a1.5 1.5 0 0 1 1.5 1.5v5.55l.2.15a2.5 2.5 0 1 1-3.4 0l.2-.15V4A1.5 1.5 0 0 1 8 2.5m0 1a.5.5 0 0 0-.5.5v5.85l-.25.15a1.25 1.25 0 1 0 1.5 0l-.25-.15V4a.5.5 0 0 0-.5-.5" />
                        </svg>
                        <span>Feels like</span>
                    </div>
                    <div class="metric-value" id="realFeel"></div>
                </div>

                <div class="metric-item">
                    <div class="metric-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            class="wind-svg" viewBox="0 0 16 16">
                            <path
                                d="M12.5 2A2.5 2.5 0 0 0 10 4.5a.5.5 0 0 1-1 0A3.5 3.5 0 1 1 12.5 8H.5a.5.5 0 0 1 0-1h12a2.5 2.5 0 0 0 0-5m-7 1a1 1 0 0 0-1 1 .5.5 0 0 1-1 0 2 2 0 1 1 2 2h-5a.5.5 0 0 1 0-1h5a1 1 0 0 0 0-2M0 9.5A.5.5 0 0 1 .5 9h10.042a3 3 0 1 1-3 3 .5.5 0 0 1 1 0 2 2 0 1 0 2-2H.5a.5.5 0 0 1-.5-.5" />
                        </svg>
                        <span>Wind Speed</span>
                    </div>
                    <div class="metric-value" id="windSpeed"></div>
                </div>

                <div class="metric-item">
                    <div class="metric-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            class="moisture-svg" viewBox="0 0 16 16">
                            <path
                                d="M13.5 0a.5.5 0 0 0 0 1H15v2.75h-.5a.5.5 0 0 0 0 1h.5V7.5h-1.5a.5.5 0 0 0 0 1H15v2.75h-.5a.5.5 0 0 0 0 1h.5V15h-1.5a.5.5 0 0 0 0 1h2a.5.5 0 0 0 .5-.5V.5a.5.5 0 0 0-.5-.5zM7 1.5l.364-.343a.5.5 0 0 0-.728 0l-.002.002-.006.007-.022.023-.08.088a29 29 0 0 0-1.274 1.517c-.769.983-1.714 2.325-2.385 3.727C2.368 7.564 2 8.682 2 9.733 2 12.614 4.212 15 7 15s5-2.386 5-5.267c0-1.05-.368-2.169-.867-3.212-.671-1.402-1.616-2.744-2.385-3.727a29 29 0 0 0-1.354-1.605l-.022-.023-.006-.007-.002-.001zm0 0-.364-.343zm-.016.766L7 2.247l.016.019c.24.274.572.667.944 1.144.611.781 1.32 1.776 1.901 2.827H4.14c.58-1.051 1.29-2.046 1.9-2.827.373-.477.706-.87.945-1.144zM3 9.733c0-.755.244-1.612.638-2.496h6.724c.395.884.638 1.741.638 2.496C11 12.117 9.182 14 7 14s-4-1.883-4-4.267" />
                        </svg>
                        <span>Humidity</span>
                    </div>
                    <div class="metric-value" id="humidity"></div>
                </div>

                <div class="metric-item">
                    <div class="metric-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"
                            fill="currentColor" class="pressure-svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14zm0-1.333A5.667 5.667 0 1 0 8 2.333a5.667 5.667 0 0 0 0 11.334z" />
                            <path
                                d="M8 5.667a.667.667 0 0 0-.667.667v3.512a1.333 1.333 0 1 0 1.334 0V6.333A.667.667 0 0 0 8 5.667z" />
                            <circle cx="8" cy="3.667" r="0.667" />
                            <circle cx="5.333" cy="5" r="0.667" />
                            <circle cx="10.667" cy="5" r="0.667" />
                            <circle cx="4" cy="7.667" r="0.667" />
                            <circle cx="12" cy="7.667" r="0.667" />
                        </svg>
                        <span>Air Pressure</span>
                    </div>
                    <div class="metric-value" id="airPressure"></div>
                </div>
            </div>
        </div>

        <div class="sun-details">
            <div class="sun-header">
                <p>SUN CYCLE</p>
            </div>

            <div class="sun-schedule">
                <div class="sunRise">
                    <div class="sun-section">
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#FFB74D"
                                class="sunrise" viewBox="0 0 16 16">
                                <path
                                    d="M7.646 1.146a.5.5 0 0 1 .708 0l1.5 1.5a.5.5 0 0 1-.708.708L8.5 2.707V4.5a.5.5 0 0 1-1 0V2.707l-.646.647a.5.5 0 1 1-.708-.708zM2.343 4.343a.5.5 0 0 1 .707 0l1.414 1.414a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707m11.314 0a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0M8 7a3 3 0 0 1 2.599 4.5H5.4A3 3 0 0 1 8 7m3.71 4.5a4 4 0 1 0-7.418 0H.499a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10m13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
                            </svg>
                        </div>
                        <div class="details">
                            <span class="label">Sunrise</span>
                            <span class="time" id="sunrise-time"></span>
                        </div>
                    </div>
                </div>

                <div class="line"></div>

                <div class="sunSet">
                    <div class="sun-section">
                        <div class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#FF8A65" class="sunset"
                                viewBox="0 0 16 16">
                                <path
                                    d="M7.646 4.854a.5.5 0 0 0 .708 0l1.5-1.5a.5.5 0 0 0-.708-.708l-.646.647V1.5a.5.5 0 0 0-1 0v1.793l-.646-.647a.5.5 0 1 0-.708.708zm-5.303-.51a.5.5 0 0 1 .707 0l1.414 1.413a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707zm11.314 0a.5.5 0 0 1 0 .706l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zM8 7a3 3 0 0 1 2.599 4.5H5.4A3 3 0 0 1 8 7m3.71 4.5a4 4 0 1 0-7.418 0H.499a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10m13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
                            </svg>
                        </div>
                        <div class="details">
                            <span class="label">Sunset</span>
                            <span class="time" id="sunset-time"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
